name: Test262

# Runs automatically on every push to master. For a PR, dispatch it manually
# with the PR number, or let a maintainer trigger it before merging.
#
# The workflow file comes from the default branch for manual dispatches, so it
# is also the safer way to test an outside PR. The PR code is still checked
# out and run in the job container.
#
# Why not a label-triggered job? GitHub treats a skipped required check as
# acceptable. A label-filtered job named `test262` would create a skipped
# check on unlabeled PRs, which could satisfy the required check without
# running anything. This workflow posts a `test262` commit status only when it
# actually runs, so it is safe to require.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (for example: 123)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: test262-${{ github.event_name }}-${{ inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: run
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 30
    container:
      image: kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        # Populated/updated by ci/github/update-test262.sh.
        - kettevm-test262:/test262:ro
    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr }}
          PUSH_SHA: ${{ github.sha }}
        with:
          script: |
            if (process.env.EVENT_NAME === 'push') {
              core.setOutput('sha', process.env.PUSH_SHA);
              core.setOutput('ref', process.env.PUSH_SHA);
              core.info(`master push: ${process.env.PUSH_SHA}`);
              return;
            }

            const pr = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pr) || pr <= 0) {
              core.setFailed(`invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            // Post the required status on the PR head, but test the merge
            // commit when GitHub has one (same thing the pull_request
            // workflow tests).
            const ref = data.merge_commit_sha
              ? `refs/pull/${pr}/merge`
              : `refs/pull/${pr}/head`;
            core.setOutput('sha', data.head.sha);
            core.setOutput('ref', ref);
            core.info(`PR #${pr}: head ${data.head.sha}, testing ${ref}`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run test262
        id: test
        env:
          TEST262_DIR: /test262
        run: ./ci/github/test262.sh

      - name: Upload test262 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-log-${{ inputs.pr || github.sha }}
          path: test262.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Post test262 status
        if: always() && steps.target.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME || 'failure';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'test262',
              description: `test262 (${process.env.EVENT_NAME}): ${outcome}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`posted test262=${state} on ${process.env.TARGET_SHA}`);
