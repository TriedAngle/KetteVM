name: negative-control

# The negative-control gate (ported from JonasOberhauser/agent-scripts
# #143/#156): every test touched or added by a PR must FAIL on at
# least one companion fault branch — proving the test can actually
# fail — OR be its own negative control (fail in its own last-touch
# commit, the test-first RED shape).
#
# PR message contract (opt-in per PR):
#
#     Negative Control:
#     ```
#     /branch/A
#     /branch/B
#     ```
#
# Rules:
#   1. The diff PR-head ↔ branch must be COMPLETELY outside tests —
#      all test code 100% identical; any test diff rejects the PR.
#   2. Every test file modified or ADDED by the PR (deletions exempt)
#      must fail on at least one of those branches when run there.
#   3. A touched test that passes on every branch rejects the PR.
#   4. Self-control: a touched test that FAILS in the LAST commit that
#      touched it is its own negative control — no branch required.
#      Only the last touching commit counts (introduce-a-wrong-failing
#      test then fix the TEST does not); a non-building own-commit
#      proves nothing.
#   5. A declared branch that does not exist rejects (gracefully); a
#      branch that does not BUILD rejects (a broken control proves
#      nothing).
#   6. Span-level rule 1 (ra_ap_syntax via tools/test-spans): test
#      REGIONS must be whitespace-neutral identical; reformat-only
#      diffs are cosmetic, not violations. An opt-out block
#      ("The following tests have been touched only cosmetically:")
#      drops listed tests (human review verifies the claim).
#
# KetteVM's two test kinds (both live under tests/ directories):
#   - `<crate>/tests/<name>.rs`  → cargo test -p <crate> --test <name>
#   - `tests/regression/**.js`   → cargo run -p vm --example
#                                  regression -- <file> (exit code)
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: negative-control-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /target

jobs:
  gate:
    name: negative control (tests must be able to fail)
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 40
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base..head, branch, and self-control diffs need history
          persist-credentials: false

      - name: Parse the Negative Control block
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          # The event payload carries the body (no API call, no gh
          # dependency - the container image ships no gh CLI; the
          # `edited` trigger re-fires with the updated body).
          body = os.environ.get("PR_BODY") or ""

          branches = []
          cosmetic = []
          in_block = False
          seen_marker = False
          # Which block we are inside of: "nc" (branches) or "cosmetic".
          which = None
          for line in body.splitlines():
              stripped = line.strip()
              # A NEW marker resets any earlier block: PR bodies quote
              # the contract (example blocks) — the LAST declaration
              # is the real one.
              low = stripped.lower()
              if low.startswith("negative control") and stripped.endswith(":"):
                  seen_marker = True; which = "nc"; branches = []; in_block = False
                  continue
              if low.startswith("the following tests have been touched only cosmetically"):
                  seen_marker = True; which = "cosmetic"; cosmetic = []; in_block = False
                  continue
              if not seen_marker:
                  continue
              if stripped.startswith("```"):
                  in_block = not in_block
                  continue
              if in_block and which == "nc" and stripped.startswith("/"):
                  branches.append(stripped)
              if in_block and which == "cosmetic" and stripped:
                  cosmetic.append(stripped)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"branches={json.dumps(branches)}\n")
              out.write(f"cosmetic={json.dumps(cosmetic)}\n")
          print("negative-control branches:", branches or "(none)")
          print("cosmetic-only tests:", cosmetic or "(none)")
          PY

      - name: Gate — identical tests, every touched test fails somewhere
        env:
          BRANCHES: ${{ steps.parse.outputs.branches }}
          COSMETIC: ${{ steps.parse.outputs.cosmetic }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "ci/github")
          import region_diff

          branches = json.loads(os.environ["BRANCHES"])
          cosmetic = set(json.loads(os.environ.get("COSMETIC", "[]")))
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]

          def sh(*cmd, check=True):
              return subprocess.run(cmd, capture_output=True, text=True, check=check)

          def spans_for(file, text):
              # Write the version to a temp file and ask test-spans.
              import tempfile
              with tempfile.NamedTemporaryFile("w", suffix=".rs", delete=False) as f:
                  f.write(text); tmp = f.name
              out = sh("cargo", "run", "-q", "-p", "test-spans", "--", tmp, check=False)
              os.unlink(tmp)
              if out.returncode != 0:
                  return None  # unparseable: treat as no spans (whole file rules)
              try:
                  return json.loads(out.stdout.strip().splitlines()[-1])
              except Exception:
                  return None

          region_diff.spans_of = spans_for

          # ── Touched test FILES (deletions exempt) ──
          diff = sh("git", "diff", "--name-only", "--diff-filter=ACMR", base, head).stdout
          touched = sorted(l for l in diff.splitlines() if l.endswith(".rs"))
          if not touched:
              print("no touched rust files — gate passes vacuously")
              sys.exit(0)
          print("touched files:")
          for t in touched:
              print("  ", t)

          # ── Per-file: which TESTS changed (base vs head)? ──
          # This is the coverage unit now: a test (by span path).
          head_texts, base_texts = {}, {}
          changed_tests = {}   # (file, test_path) -> kind
          for f in touched:
              b = sh("git", "show", f"{base}:{f}", check=False).stdout
              h = sh("git", "show", f"{head}:{f}", check=False).stdout
              if b == h:
                  continue
              base_texts[f], head_texts[f] = b, h
              sp_a = spans_for(f, b) or []
              sp_h = spans_for(f, h) or []
              for path, kind in region_diff.changed_test_regions(f, sp_a, b, sp_h, h):
                  changed_tests[(f, path)] = kind
          if not changed_tests:
              print("no changed test regions — gate passes (library-only PR)")
              sys.exit(0)
          print("changed tests:")
          for (f, p), k in sorted(changed_tests.items()):
              print(f"   {f} :: {p} ({k})")

          # Cosmetic opt-out: listed tests drop out of coverage AND
          # rule 1 (human reviewers verify the claim).
          dropped = [(f, p) for (f, p) in changed_tests if p in cosmetic or f"{f}::{p}" in cosmetic]
          for d in dropped:
              print(f"   cosmetic opt-out: {d[0]} :: {d[1]} (human-verified)")
          need = {k: v for k, v in changed_tests.items() if k not in dropped}
          if not need:
              print("gate ok: every changed test is cosmetic-opt-out")
              sys.exit(0)

          # ── Rule 1 (span-level): on each declared branch, every
          # ── NOT-opted-out test region must be cosmetic-equal.  ──
          for b in branches:
              ref = b[1:] if b.startswith("/") else b
              if sh("git", "fetch", "--depth=1", "origin", ref, check=False).returncode != 0:
                  print(f"REJECT: branch {ref} not found"); sys.exit(1)
              sha = sh("git", "rev-parse", f"origin/{ref}").stdout.strip()
              for f in head_texts:
                  br = sh("git", "show", f"{sha}:{f}", check=False).stdout
                  sp_b = spans_for(f, br) or []
                  sp_h = spans_for(f, head_texts[f]) or []
                  for path, kind in region_diff.changed_test_regions(f, sp_b, br, sp_h, head_texts[f]):
                      if kind == "changed" and (f, path) not in dropped:
                          print(f"REJECT: {ref} changes test {f} :: {path} beyond whitespace")
                          sys.exit(1)
          if branches:
              print("rule 1 ok: every branch is test-region-identical (whitespace-neutral)")
          else:
              print("no declared branches — self-control is the only path")

          # ── The RUNNER: how a test file/target executes. ──
          def runner_of(file):
              if file.startswith("tests/regression/") and file.endswith(".js"):
                  return ("regression", file)
              parts = file.split("/tests/")
              if len(parts) == 2 and parts[0] and parts[1].endswith(".rs"):
                  return ("cargo", (parts[0].split("/")[-1], parts[1][:-3]))
              return None

          def run_file(file, check=False):
              r = runner_of(file)
              if r is None:
                  return None
              if r[0] == "regression":
                  return sh("cargo", "run", "--locked", "-p", "vm", "--example", "regression", "--", r[1], check=check)
              pkg, stem = r[1]
              return sh("cargo", "test", "--locked", "-p", pkg, "--test", stem, check=check)

          def run_test(file, path, check=False):
              r = runner_of(file)
              if r is None:
                  return None
              if r[0] == "regression":
                  return run_file(file, check=check)
              pkg, stem = r[1]
              return sh("cargo", "test", "--locked", "-p", pkg, "--test", stem, "--",
                        f"{path} --exact", check=check)

          def build(check=False):
              return sh("cargo", "build", "--locked", "--workspace", "--all-targets", check=check)

          files = sorted({f for f, _ in need})
          runnables = [(f, runner_of(f)) for f in files]
          runnables = [(f, r) for f, r in runnables if r is not None]
          if not runnables:
              print("changed tests map to no runner — gate passes (review covers them)")
              sys.exit(0)

          # ── Self-control: the LAST commit touching the FILE, the  ──
          # ── specific test must FAIL there.                        ──
          self_caught = set()
          for (f, p), kind in sorted(need.items()):
              out = sh("git", "rev-list", base + ".." + head, "--", f).stdout
              shas = out.split()
              if not shas:
                  continue
              sha = shas[0]
              sh("git", "checkout", "-q", "--detach", sha)
              if build(check=False).returncode != 0:
                  print(f"  self-control {f} :: {p}: last-touch commit does not build — no proof")
                  continue
              if run_test(f, p, check=False).returncode != 0:
                  print(f"  self-control {f} :: {p}: FAILS in its own last-touch commit")
                  self_caught.add((f, p))
          sh("git", "checkout", "-q", head)

          need_b = {k: v for k, v in need.items() if k not in self_caught}
          if not need_b:
              print("gate ok: every changed test is its own negative control")
              sys.exit(0)
          if not branches:
              print("REJECT: changed tests with neither self-control nor declared branches:")
              for (f, p) in sorted(need_b):
                  print(f"   {f} :: {p}")
              sys.exit(1)

          # ── Branches: each remaining test must fail somewhere. ──
          results = {k: False for k in need_b}
          for b in branches:
              ref = b[1:] if b.startswith("/") else b
              sha = sh("git", "rev-parse", f"origin/{ref}").stdout.strip()
              sh("git", "checkout", "-q", "--detach", sha)
              print(f"=== {ref}: building")
              if build(check=False).returncode != 0:
                  print(f"REJECT: branch {ref} does not build — a broken negative control proves nothing")
                  sys.exit(1)
              for (f, p) in sorted(need_b):
                  failed = run_test(f, p, check=False).returncode != 0
                  print(f"  {f} :: {p}: {'FAIL (caught)' if failed else 'pass'}")
                  if failed:
                      results[(f, p)] = True

          missed = [k for k, caught in results.items() if not caught]
          if missed:
              print("REJECT: tests that pass on EVERY negative-control branch:")
              for (f, p) in sorted(missed):
                  print(f"   {f} :: {p}")
              sys.exit(1)
          print("gate ok: every changed test fails on at least one branch")
          PY