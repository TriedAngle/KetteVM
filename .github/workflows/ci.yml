name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /target

jobs:
  format:
    name: format
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 10
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Format (workspace)
        run: cargo fmt --all --check

      - name: Format (interpreter)
        working-directory: interpreter
        run: cargo +nightly fmt --check

  build:
    name: build
    needs: format
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 40
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        # Shared Cargo target cache. The build job warms every variant so the
        # test and extended-check jobs only have to run the binaries.
        - kettevm-cargo-target:/target
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build release (match)
        run: |
          cargo build --release -p vm --locked
          cargo build --release -p vm --example test262 --locked
          cargo build --release -p vm --example regression --locked

      - name: Build tests (match)
        run: cargo test --workspace --locked --no-run

      - name: Build GC-stress tests (match)
        run: cargo test --workspace --locked --no-run --features vm/stress-minor-gc

      - name: Build release (nightly become)
        run: |
          cargo +nightly build --release -p vm --features fast --locked
          cargo +nightly build --release -p vm --example test262 --features fast --locked
          cargo +nightly build --release -p vm --example regression --features fast --locked

      - name: Build tests (nightly become)
        run: cargo +nightly test --workspace --locked --no-run --features vm/fast

      - name: Build GC-stress tests (nightly become)
        run: cargo +nightly test --workspace --locked --no-run --features vm/stress-minor-gc,vm/fast

      - name: Build interpreter tests
        working-directory: interpreter
        run: |
          cargo +nightly test --release --locked --features fast --no-run
          cargo +nightly test --release --locked --features fast,stress-minor-gc --no-run

  test:
    name: test
    needs: build
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 20
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test (stable match)
        run: cargo test --workspace --locked

      - name: Test (nightly become)
        run: cargo +nightly test --workspace --locked --features vm/fast

      - name: Test (interpreter)
        working-directory: interpreter
        run: cargo +nightly test --release --locked --features fast


  regression:
    name: regression
    needs: build
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 10
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Regression (stable match)
        run: cargo run --release -p vm --example regression --locked

      - name: Regression (nightly become)
        run: cargo +nightly run --release -p vm --example regression --features fast --locked
