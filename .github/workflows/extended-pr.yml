name: Extended checks (PR)

# Manual-only for pull requests. The jobs are named pr-* so a manual dispatch
# does not create test262-* / gc-stress-* check runs on master; the required
# checks are the commit statuses posted on the PR head.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (for example: 123)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: extended-pr-${{ inputs.pr }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /target

jobs:
  resolve:
    name: resolve
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pr) || pr <= 0) {
              core.setFailed(`invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            const ref = data.merge_commit_sha
              ? `refs/pull/${pr}/merge`
              : `refs/pull/${pr}/head`;
            core.setOutput('sha', data.head.sha);
            core.setOutput('ref', ref);
            core.info(`PR #${pr}: head ${data.head.sha}, testing ${ref}`);

  pr-test262-match:
    name: pr-test262-match
    needs: resolve
    if: always() && needs.resolve.result == 'success'
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 30
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
        - kettevm-test262:/test262:ro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run test262 (match)
        id: test
        env:
          TEST262_ENGINE: match
        run: ./ci/github/test262.sh

      - name: Upload test262 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-match-log-pr-${{ inputs.pr }}
          path: test262.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Post test262-match status
        if: always() && needs.resolve.result == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME || 'failure';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'test262-match',
              description: `extended PR: ${outcome}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`posted test262-match=${state} on ${process.env.TARGET_SHA}`);

  pr-test262-become:
    name: pr-test262-become
    needs: [resolve, pr-test262-match]
    if: always() && needs.resolve.result == 'success'
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 30
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
        - kettevm-test262:/test262:ro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run test262 (nightly become)
        id: test
        env:
          TEST262_ENGINE: become
        run: ./ci/github/test262.sh

      - name: Upload test262 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-become-log-pr-${{ inputs.pr }}
          path: test262.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Post test262-become status
        if: always() && needs.resolve.result == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME || 'failure';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'test262-become',
              description: `extended PR: ${outcome}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`posted test262-become=${state} on ${process.env.TARGET_SHA}`);

  pr-gc-stress-match:
    name: pr-gc-stress-match
    needs: [resolve, pr-test262-become]
    if: always() && needs.resolve.result == 'success'
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 30
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: GC stress (match)
        id: test
        run: cargo test --workspace --locked --features vm/stress-minor-gc

      - name: Post gc-stress-match status
        if: always() && needs.resolve.result == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME || 'failure';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'gc-stress-match',
              description: `extended PR: ${outcome}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`posted gc-stress-match=${state} on ${process.env.TARGET_SHA}`);

  pr-gc-stress-become:
    name: pr-gc-stress-become
    needs: [resolve, pr-gc-stress-match]
    if: always() && needs.resolve.result == 'success'
    runs-on: [self-hosted, kettevm-ci]
    timeout-minutes: 30
    container:
      image: localhost:5000/kettevm-ci:1
      options: --user 1501:1501 --cap-drop=ALL --security-opt=no-new-privileges
      volumes:
        - kettevm-cargo-target:/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: GC stress (nightly become)
        id: test
        # Benchmark-style tests are excluded from GC stress; they still run
        # non-stress in the `test` job.
        run: |
          set -euo pipefail
          cargo +nightly test --workspace --locked --features vm/stress-minor-gc,vm/fast
          cd interpreter_become
          cargo +nightly test --release --locked --features stress-minor-gc -- \
            --skip bench \
            --skip deltablue \
            --skip fannkuch \
            --skip nbody

      - name: Post gc-stress-become status
        if: always() && needs.resolve.result == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME || 'failure';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'gc-stress-become',
              description: `extended PR: ${outcome}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`posted gc-stress-become=${state} on ${process.env.TARGET_SHA}`);
